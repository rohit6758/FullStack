<!DOCTYPE html>
<html>
<head>
    <title>Product Calculator</title>
</head>
<body>
    <h2>Interactive Product Calculator</h2>
    <label>Product Name: <input type="text" id="prodName"></label><br><br>
    <label>Quantity: <input type="number" id="qty" value="1"></label><br><br>
    <label>Price (Rs): <input type="number" id="price" value="0"></label><br><br>
    <h3>Total Price: Rs <span id="total">0</span></h3>

    <script>
        // basic dom elements capturing
        let q = document.getElementById('qty');
        let p = document.getElementById('price');
        let t = document.getElementById('total');

        // function to do the math when input changes
        function calc() {
            let totalVal = q.value * p.value;
            t.innerText = totalVal; // updating total instantly bro
        }

        // adding listeners so it updates live
        q.addEventListener('input', calc);
        p.addEventListener('input', calc);
    </script>
</body>
</html>
